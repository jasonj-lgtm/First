<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pairing…</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem;
      }
      .card {
        background: #1e293b;
        padding: 1.5rem;
        border-radius: 16px;
        text-align: center;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 1rem;
      }
      .state {
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .ok {
        color: #34d399;
      }
      .err {
        color: #f87171;
      }
      input,
      select,
      textarea,
      button {
        font-size: 1rem;
        padding: 0.6rem;
        border-radius: 8px;
        border: 0;
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.5rem;
        font-family: inherit;
      }
      textarea {
        min-height: 5.5rem;
        resize: vertical;
      }
      button {
        background: #6366f1;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      button.secondary {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Phone connection</h1>
      <div id="state" class="state">Pairing…</div>
      <div id="chat" hidden>
        <select id="kind" aria-label="How the screen shows this">
          <option value="message">Chat message (log only)</option>
          <option value="text">Render as big text</option>
          <option value="markdown">Render as Markdown</option>
          <option value="image">Render image from URL</option>
        </select>
        <textarea id="text" placeholder="Send something to the screen"></textarea>
        <button id="send">Send</button>
        <button id="clear" class="secondary">Clear screen</button>
      </div>
    </div>
    <script type="module" src="/phone.js"></script>
  </body>
</html>
