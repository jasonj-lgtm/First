<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect a phone</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        background: #1e293b;
        padding: 2rem;
        border-radius: 16px;
        text-align: center;
        max-width: 360px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 0.25rem 0 1.5rem;
      }
      img {
        width: 240px;
        height: 240px;
        background: #fff;
        border-radius: 12px;
        padding: 8px;
      }
      .status {
        margin-top: 1.25rem;
        font-weight: 600;
      }
      .status.pending {
        color: #fbbf24;
      }
      .status.connected {
        color: #34d399;
      }
      .status.expired {
        color: #f87171;
      }
      button {
        margin-top: 1rem;
        background: #6366f1;
        color: #fff;
        border: 0;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .log {
        margin-top: 1rem;
        text-align: left;
        font-size: 0.8rem;
        color: #cbd5e1;
        max-height: 120px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Connect a phone</h1>
      <p>Scan this code with your phone's camera to pair.</p>
      <img id="qr" alt="Pairing QR code" />
      <div id="status" class="status pending">Waiting for phone…</div>
      <button id="refresh" hidden>New code</button>
      <div id="log" class="log"></div>
    </div>
    <script type="module" src="/screen.js"></script>
  </body>
</html>
